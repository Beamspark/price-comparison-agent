name: Daily Price Intelligence Tracker

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  track-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Rastreo Diario y Notificador
        env:
          LEROY_COOKIE: ${{ secrets.LEROY_COOKIE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: |
          python tracker_diario.py

      - name: Persistir histórico y hacer Commit
        run: |
          git config --global user.name "Price Tracker Bot"
          git config --global user.email "bot@price-tracker.github"
          git add historico_precios.csv
          if git diff --staged --quiet; then
            echo "Sin variaciones en el histórico."
          else
            git commit -m "chore(data): actualización diaria de precios [skip ci]"
            git push
          fi